<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>YUNG — Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <!-- =========================
         HERO
         ========================= -->

    <section class="hero">

      <img
        src="images/8444.jpeg"
        alt="YUNG Portfolio — Hero"
      >

      <div class="hero-info">

        <!-- DEIN ACCOUNT -->
        <a
          class="hero-own-link"
          href="https://www.instagram.com/yung.com2k/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @yung.com2k
        </a>

        <!-- TITEL -->
        <div class="hero-title">
          YUNG
        </div>

        <!-- FOTOGRAFIE -->
        <div class="hero-credit">
          Fotografie — Selina Accibas
        </div>

        <!-- SELINNA ACCOUNT -->
        <a
          class="hero-link"
          href="https://www.instagram.com/selinna.ph/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @selinna.ph
        </a>

      </div>

      <div class="scroll-arrow">
        ↓
      </div>

    </section>


    <!-- =========================
         PORTFOLIO
         ========================= -->

    <section
      class="portfolio"
      id="portfolio"
      aria-label="Portfolio"
    ></section>

  </main>


  <!-- =========================
       FULLSCREEN VIEWER
       ========================= -->

  <dialog
    id="viewer"
    aria-label="Bildansicht"
  >

    <button
      id="close"
      type="button"
      aria-label="Schließen"
    >
      ×
    </button>

    <img
      id="viewer-image"
      alt=""
    >

  </dialog>


  <script src="script.js"></script>

</body>
</html>
