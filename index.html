<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>YUNG — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portfolio" aria-label="YUNG portfolio">
    <header class="intro">
      <div class="brand">YUNG</div>
      <div class="meta">Portfolio / 2026</div>
    </header>

    <section class="grid" id="grid">
      <!-- Landscape images span both columns; portrait images occupy one column,
           reproducing the visual rhythm of the reference portfolio. -->
    </section>
  </main>

  <dialog id="viewer">
    <button class="close" aria-label="Bild schließen">×</button>
    <img id="viewerImage" alt="">
  </dialog>

  <script src="script.js"></script>
</body>
</html>
