<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>YUNG — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <section class="hero">
      <img src="images/8444.jpeg" alt="YUNG portfolio — hero">

      <div class="hero-info">
        <div class="hero-title">YUNG</div>

        <div class="hero-credit">
          Fotografie — Selinna Accibas
        </div>

        <a
          class="hero-link"
          href="https://www.instagram.com/selinna.ph/"
          target="_blank"
          rel="noopener noreferrer"
        >
          @selinna.ph
        </a>
      </div>

      <div class="scroll-arrow">⌄</div>
    </section>

    <section class="portfolio-grid" id="portfolio"></section>

  </main>

  <dialog id="viewer" aria-label="Bildansicht">
    <button id="close" aria-label="Schließen">×</button>
    <img id="viewer-image" alt="">
  </dialog>

  <script src="script.js"></script>
</body>
</html>
